version: 2

project_name: gh-contrib-tui

builds:
  - id: gh-contrib-tui
    main: ./cmd/gh-contrib-tui
    binary: gh-contrib-tui
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.buildVersion={{ .Tag }}
    # Reproducible: the same tag always yields byte-identical binaries.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

nfpms:
  - id: packages
    ids: [gh-contrib-tui]
    package_name: gh-contrib-tui
    formats: [deb, rpm, apk]
    vendor: Rocky Gray
    maintainer: Rocky Gray <grocky@users.noreply.github.com>
    homepage: https://github.com/grocky/gh-contrib-tui
    description: Terminal dashboard of a GitHub team's contributions.
    license: MIT
    section: utils
    bindir: /usr/bin
    # Opening links and copying to the clipboard shell out to these; without
    # them the TUI still works, so they are suggestions, not dependencies.
    suggests:
      - xdg-utils
      - xclip
      - wl-clipboard
    contents:
      - src: LICENSE
        dst: /usr/share/doc/gh-contrib-tui/copyright
      - src: README.md
        dst: /usr/share/doc/gh-contrib-tui/README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^\\(?docs\\)?"
      - "^ci"

release:
  footer: |
    **Windows builds are untested.** They compile, but opening a browser and
    copying to the clipboard have not been exercised on Windows yet. Reports are
    welcome.

    Verify a download with `gh attestation verify <archive> --repo grocky/gh-contrib-tui`
    or against `checksums.txt`.
