name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # setup-go installs go.mod's minimum Go and pins GOTOOLCHAIN=local. The
      # module is still built and tested on that version, since nothing in it
      # asks for newer; auto only lets the pinned tools fetch the Go they need.
      - run: make audit
        env:
          GOTOOLCHAIN: auto
