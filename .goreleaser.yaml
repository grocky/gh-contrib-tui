version: 2

project_name: gh-contrib-tui

builds:
  - id: gh-contrib-tui
    main: ./cmd/gh-contrib-tui
    binary: gh-contrib-tui
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.buildVersion={{ .Tag }}
    # Reproducible: the same tag always yields byte-identical binaries.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^\\(?docs\\)?"
      - "^ci"

release:
  footer: |
    **Windows builds are untested.** They compile, but opening a browser and
    copying to the clipboard have not been exercised on Windows yet. Reports are
    welcome.

    Verify a download with `gh attestation verify <archive> --repo grocky/gh-contrib-tui`
    or against `checksums.txt`.
